services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    build: ./server
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URL: ${MONGODB_URL:?Set MONGODB_URL in server/.env}
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in server/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DATASET_VERSION: ${DATASET_VERSION:-1.0.0}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-bd-geo-service}
    ports:
      - "4000:4000"
